<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Montserrat, 'Segoe UI', Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF7A2B"/></marker><marker id="arm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7b4c4"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff5a5a"/></marker></defs><rect width="1200" height="600" rx="24" fill="#0f2a47"/><rect x="40" y="36" width="8" height="34" rx="3" fill="#FF7A2B"/><text x="62" y="64.0" font-size="30" fill="#ffffff" font-weight="700" text-anchor="start">How machine learning differs from programming</text><text x="60" y="130.0" font-size="22" fill="#ffffff" font-weight="700" text-anchor="start">Classic programming</text><rect x="60" y="150" width="200" height="110" rx="16" fill="#17395f" stroke="#2b4a6f" stroke-width="2.5"/><text x="160.0" y="210.8" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">Data</text><text x="290" y="216.0" font-size="36" fill="#a7b4c4" font-weight="700" text-anchor="middle">+</text><rect x="320" y="150" width="200" height="110" rx="16" fill="#17395f" stroke="#2b4a6f" stroke-width="2.5"/><text x="420.0" y="210.8" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">Rules</text><line x1="528" y1="205" x2="588" y2="205" stroke="#FF7A2B" stroke-width="3.5" marker-end="url(#ar)"/><rect x="595" y="150" width="230" height="110" rx="16" fill="#17395f" stroke="#2b4a6f" stroke-width="2.5"/><text x="710.0" y="210.8" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">Program</text><line x1="833" y1="205" x2="893" y2="205" stroke="#FF7A2B" stroke-width="3.5" marker-end="url(#ar)"/><rect x="900" y="150" width="240" height="110" rx="16" fill="#17395f" stroke="#2b4a6f" stroke-width="2.5"/><text x="1020.0" y="210.8" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">Answers</text><text x="60" y="340.0" font-size="22" fill="#FF7A2B" font-weight="700" text-anchor="start">Machine learning</text><rect x="60" y="360" width="200" height="110" rx="16" fill="#17395f" stroke="#2b4a6f" stroke-width="2.5"/><text x="160.0" y="420.8" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">Data</text><text x="290" y="426.0" font-size="36" fill="#a7b4c4" font-weight="700" text-anchor="middle">+</text><rect x="320" y="360" width="200" height="110" rx="16" fill="#17395f" stroke="#2b4a6f" stroke-width="2.5"/><text x="420.0" y="407.6" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">Answers</text><text x="420.0" y="433.9" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">(examples)</text><line x1="528" y1="415" x2="588" y2="415" stroke="#FF7A2B" stroke-width="3.5" marker-end="url(#ar)"/><rect x="595" y="360" width="230" height="110" rx="16" fill="#17395f" stroke="#FF7A2B" stroke-width="2.5"/><text x="710.0" y="420.8" font-size="21" fill="#FF7A2B" font-weight="700" text-anchor="middle">Training</text><line x1="833" y1="415" x2="893" y2="415" stroke="#FF7A2B" stroke-width="3.5" marker-end="url(#ar)"/><rect x="900" y="360" width="240" height="110" rx="16" fill="#17395f" stroke="#FF7A2B" stroke-width="2.5"/><text x="1020.0" y="407.6" font-size="21" fill="#FF7A2B" font-weight="700" text-anchor="middle">Model</text><text x="1020.0" y="433.9" font-size="21" fill="#FF7A2B" font-weight="700" text-anchor="middle">(the “rules”)</text><text x="600" y="540.0" font-size="19" fill="#a7b4c4" font-weight="500" text-anchor="middle">The model is then applied to new data it has never seen.</text><text x="600" y="565.6" font-size="19" fill="#a7b4c4" font-weight="500" text-anchor="middle">This step is called inference.</text></svg>