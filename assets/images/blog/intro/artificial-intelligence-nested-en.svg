<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" width="1200" height="730" font-family="Montserrat, 'Segoe UI', Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF7A2B"/></marker><marker id="arm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7b4c4"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff5a5a"/></marker></defs><rect width="1200" height="730" rx="24" fill="#0f2a47"/><rect x="40" y="36" width="8" height="34" rx="3" fill="#FF7A2B"/><text x="62" y="64.0" font-size="30" fill="#ffffff" font-weight="700" text-anchor="start">AI, machine learning, deep learning, LLMs</text><circle cx="360" cy="410" r="290" fill="#163556" stroke="#2b4a6f" stroke-width="2"/><circle cx="360" cy="480" r="220" fill="#1b4066" stroke="#2b4a6f" stroke-width="2"/><circle cx="360" cy="550" r="150" fill="#22507e" stroke="#2b4a6f" stroke-width="2"/><circle cx="360" cy="620" r="80" fill="#FF7A2B" stroke="#2b4a6f" stroke-width="2"/><text x="360" y="162.0" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">Artificial intelligence</text><text x="360" y="302.0" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">Machine learning</text><text x="360" y="442.0" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">Deep</text><text x="360" y="469.3" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">learning</text><text x="360" y="628.0" font-size="21" fill="#0f2a47" font-weight="700" text-anchor="middle">LLM</text><circle cx="770" cy="153" r="11" fill="#163556" stroke="#a7b4c4" stroke-width="2"/><text x="795" y="160.0" font-size="22" fill="#ffffff" font-weight="700" text-anchor="start">Artificial intelligence</text><text x="795" y="190.0" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="start">Any system that performs “smart”</text><text x="795" y="212.9" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="start">tasks, even one built on rules</text><circle cx="770" cy="288" r="11" fill="#1b4066" stroke="#a7b4c4" stroke-width="2"/><text x="795" y="295.0" font-size="22" fill="#ffffff" font-weight="700" text-anchor="start">Machine learning</text><text x="795" y="325.0" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="start">Learns from examples</text><text x="795" y="347.9" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="start">instead of hand-written rules</text><circle cx="770" cy="423" r="11" fill="#22507e" stroke="#a7b4c4" stroke-width="2"/><text x="795" y="430.0" font-size="22" fill="#ffffff" font-weight="700" text-anchor="start">Deep learning</text><text x="795" y="460.0" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="start">Multi-layer neural networks:</text><text x="795" y="482.9" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="start">vision, language, sound</text><circle cx="770" cy="558" r="11" fill="#FF7A2B" stroke="#FF7A2B" stroke-width="2"/><text x="795" y="565.0" font-size="22" fill="#ffffff" font-weight="700" text-anchor="start">Generative AI and LLMs</text><text x="795" y="595.0" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="start">Creates text, code, images;</text><text x="795" y="618.0" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="start">understands requests in plain language</text></svg>