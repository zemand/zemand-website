<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="Montserrat, 'Segoe UI', Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF7A2B"/></marker><marker id="arm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7b4c4"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff5a5a"/></marker></defs><rect width="1200" height="440" rx="24" fill="#0f2a47"/><rect x="40" y="36" width="8" height="34" rx="3" fill="#FF7A2B"/><text x="62" y="64.0" font-size="30" fill="#ffffff" font-weight="700" text-anchor="start">Система машинного зору на лінії</text><rect x="40.0" y="130" width="190" height="190" rx="16" fill="#17395f" stroke="#2b4a6f" stroke-width="2.5"/><text x="135.0" y="189.7" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">Світло</text><text x="135.0" y="216.0" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">і камера</text><text x="135.0" y="250.2" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="middle">Рівне освітлення,</text><text x="135.0" y="273.2" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="middle">чіткий кадр</text><line x1="236.0" y1="225" x2="266.5" y2="225" stroke="#FF7A2B" stroke-width="3.5" marker-end="url(#ar)"/><rect x="272.5" y="130" width="190" height="190" rx="16" fill="#17395f" stroke="#2b4a6f" stroke-width="2.5"/><text x="367.5" y="202.8" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">Знімок</text><text x="367.5" y="237.1" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="middle">Деталь у кадрі</text><text x="367.5" y="260.0" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="middle">за сигналом датчика</text><line x1="468.5" y1="225" x2="499.0" y2="225" stroke="#FF7A2B" stroke-width="3.5" marker-end="url(#ar)"/><rect x="505.0" y="130" width="190" height="190" rx="16" fill="#17395f" stroke="#FF7A2B" stroke-width="2.5"/><text x="600.0" y="202.8" font-size="21" fill="#FF7A2B" font-weight="700" text-anchor="middle">Аналіз</text><text x="600.0" y="237.1" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="middle">Алгоритм або</text><text x="600.0" y="260.0" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="middle">нейромережа</text><line x1="701.0" y1="225" x2="731.5" y2="225" stroke="#FF7A2B" stroke-width="3.5" marker-end="url(#ar)"/><rect x="737.5" y="130" width="190" height="190" rx="16" fill="#17395f" stroke="#2b4a6f" stroke-width="2.5"/><text x="832.5" y="202.8" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">Рішення</text><text x="832.5" y="237.1" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="middle">Добре / брак,</text><text x="832.5" y="260.0" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="middle">розмір, позиція</text><line x1="933.5" y1="225" x2="964.0" y2="225" stroke="#FF7A2B" stroke-width="3.5" marker-end="url(#ar)"/><rect x="970.0" y="130" width="190" height="190" rx="16" fill="#17395f" stroke="#2b4a6f" stroke-width="2.5"/><text x="1065.0" y="202.8" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">Дія</text><text x="1065.0" y="237.1" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="middle">Відбраковка,</text><text x="1065.0" y="260.0" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="middle">сигнал у ПЛК</text><text x="600" y="385.0" font-size="20" fill="#FF7A2B" font-weight="600" text-anchor="middle">Половина успіху — у світлі й камері, а не в алгоритмі</text></svg>