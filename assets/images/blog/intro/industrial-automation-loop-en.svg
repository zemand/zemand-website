<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Montserrat, 'Segoe UI', Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF7A2B"/></marker><marker id="arm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7b4c4"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff5a5a"/></marker></defs><rect width="1200" height="640" rx="24" fill="#0f2a47"/><rect x="40" y="36" width="8" height="34" rx="3" fill="#FF7A2B"/><text x="62" y="64.0" font-size="30" fill="#ffffff" font-weight="700" text-anchor="start">The control loop: measure → decide → act</text><rect x="70" y="140" width="330" height="170" rx="16" fill="#17395f" stroke="#2b4a6f" stroke-width="2.5"/><text x="235.0" y="200.9" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">Sensor</text><text x="235.0" y="238.9" font-size="19" fill="#a7b4c4" font-weight="500" text-anchor="middle">Thermometer in the tank</text><text x="235.0" y="264.6" font-size="19" fill="#a7b4c4" font-weight="500" text-anchor="middle">reads 55 °C</text><rect x="800" y="140" width="330" height="170" rx="16" fill="#17395f" stroke="#FF7A2B" stroke-width="2.5"/><text x="965.0" y="200.9" font-size="24" fill="#FF7A2B" font-weight="700" text-anchor="middle">Controller (PLC)</text><text x="965.0" y="238.9" font-size="19" fill="#a7b4c4" font-weight="500" text-anchor="middle">Compares with the 60 °C</text><text x="965.0" y="264.6" font-size="19" fill="#a7b4c4" font-weight="500" text-anchor="middle">setpoint and decides: heat</text><rect x="800" y="420" width="330" height="170" rx="16" fill="#17395f" stroke="#2b4a6f" stroke-width="2.5"/><text x="965.0" y="481.0" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">Actuator</text><text x="965.0" y="519.0" font-size="19" fill="#a7b4c4" font-weight="500" text-anchor="middle">The heater</text><text x="965.0" y="544.6" font-size="19" fill="#a7b4c4" font-weight="500" text-anchor="middle">turns on</text><rect x="70" y="420" width="330" height="170" rx="16" fill="#17395f" stroke="#2b4a6f" stroke-width="2.5"/><text x="235.0" y="481.0" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">Process</text><text x="235.0" y="519.0" font-size="19" fill="#a7b4c4" font-weight="500" text-anchor="middle">Water in the tank</text><text x="235.0" y="544.6" font-size="19" fill="#a7b4c4" font-weight="500" text-anchor="middle">heats up</text><line x1="400" y1="225" x2="795" y2="225" stroke="#FF7A2B" stroke-width="3.5" marker-end="url(#ar)"/><line x1="965" y1="310" x2="965" y2="415" stroke="#FF7A2B" stroke-width="3.5" marker-end="url(#ar)"/><line x1="800" y1="505" x2="405" y2="505" stroke="#FF7A2B" stroke-width="3.5" marker-end="url(#ar)"/><line x1="235" y1="420" x2="235" y2="315" stroke="#FF7A2B" stroke-width="3.5" marker-end="url(#ar)"/><text x="600" y="212.0" font-size="18" fill="#a7b4c4" font-weight="600" text-anchor="middle">signal</text><text x="985" y="370.0" font-size="18" fill="#a7b4c4" font-weight="600" text-anchor="start">command</text><text x="600" y="538.0" font-size="18" fill="#a7b4c4" font-weight="600" text-anchor="middle">action</text><text x="215" y="370.0" font-size="18" fill="#a7b4c4" font-weight="600" text-anchor="end">change</text><rect x="530" y="265" width="140" height="170" rx="12" fill="none" stroke="#ffffff" stroke-width="4"/><path d="M533,320 Q566,305 600,320 T667,320 L667,432 L533,432 Z" fill="#5fa8e8" opacity="0.55"/><path d="M550,410 Q560,395 570,410 T590,410 T610,410 T630,410 T650,410" fill="none" stroke="#FF7A2B" stroke-width="5"/><rect x="690" y="280" width="16" height="110" rx="8" fill="none" stroke="#a7b4c4" stroke-width="3"/><rect x="694" y="320" width="8" height="66" rx="4" fill="#FF7A2B"/><circle cx="698" cy="398" r="13" fill="#FF7A2B"/></svg>