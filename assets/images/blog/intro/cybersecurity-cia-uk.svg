<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Montserrat, 'Segoe UI', Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF7A2B"/></marker><marker id="arm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7b4c4"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff5a5a"/></marker></defs><rect width="1200" height="680" rx="24" fill="#0f2a47"/><rect x="40" y="36" width="8" height="34" rx="3" fill="#FF7A2B"/><text x="62" y="64.0" font-size="30" fill="#ffffff" font-weight="700" text-anchor="start">Що захищаємо: тріада CIA і різниця між IT та OT</text><polygon points="250,160 90,470 410,470" fill="#17395f" stroke="#FF7A2B" stroke-width="4"/><circle cx="250" cy="160" r="30" fill="#FF7A2B"/><text x="250" y="169.0" font-size="26" fill="#0f2a47" font-weight="700" text-anchor="middle">C</text><circle cx="90" cy="470" r="30" fill="#FF7A2B"/><text x="90" y="479.0" font-size="26" fill="#0f2a47" font-weight="700" text-anchor="middle">I</text><circle cx="410" cy="470" r="30" fill="#FF7A2B"/><text x="410" y="479.0" font-size="26" fill="#0f2a47" font-weight="700" text-anchor="middle">A</text><text x="292" y="168.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">Конфіденційність</text><text x="90" y="528.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">Цілісність</text><text x="410" y="528.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">Доступність</text><text x="250" y="585.0" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="middle">Конфіденційність — дані бачать лише свої;</text><text x="250" y="607.1" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="middle">цілісність — їх ніхто не підмінив;</text><text x="250" y="629.2" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="middle">доступність — система працює, коли треба</text><text x="680" y="160.0" font-size="23" fill="#ffffff" font-weight="700" text-anchor="middle">Офіс (IT)</text><rect x="540.0" y="190" width="280" height="75" rx="12" fill="#17395f" stroke="#2b4a6f" stroke-width="2"/><text x="680" y="236.0" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">1. Конфіденційність</text><rect x="565.0" y="285" width="230" height="75" rx="12" fill="#17395f" stroke="#2b4a6f" stroke-width="2"/><text x="680" y="331.0" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">2. Цілісність</text><rect x="590.0" y="380" width="180" height="75" rx="12" fill="#17395f" stroke="#2b4a6f" stroke-width="2"/><text x="680" y="426.0" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">3. Доступність</text><text x="1010" y="160.0" font-size="23" fill="#FF7A2B" font-weight="700" text-anchor="middle">Завод (OT)</text><rect x="870.0" y="190" width="280" height="75" rx="12" fill="#FF7A2B" stroke="#2b4a6f" stroke-width="2"/><text x="1010" y="236.0" font-size="19" fill="#0f2a47" font-weight="700" text-anchor="middle">1. Безпека і робота</text><rect x="895.0" y="285" width="230" height="75" rx="12" fill="#17395f" stroke="#2b4a6f" stroke-width="2"/><text x="1010" y="331.0" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">2. Цілісність</text><rect x="920.0" y="380" width="180" height="75" rx="12" fill="#17395f" stroke="#2b4a6f" stroke-width="2"/><text x="1010" y="426.0" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">3. Конфіденційність</text><text x="860" y="520.0" font-size="18" fill="#a7b4c4" font-weight="500" text-anchor="middle">У цеху найгірше — не витік даних,</text><text x="860" y="544.3" font-size="18" fill="#a7b4c4" font-weight="500" text-anchor="middle">а зупинка лінії або травма людини</text></svg>