<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Montserrat, 'Segoe UI', Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF7A2B"/></marker><marker id="arm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7b4c4"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff5a5a"/></marker></defs><rect width="1200" height="700" rx="24" fill="#0f2a47"/><rect x="40" y="36" width="8" height="34" rx="3" fill="#FF7A2B"/><text x="62" y="64.0" font-size="30" fill="#ffffff" font-weight="700" text-anchor="start">What an industrial robot is made of</text><ellipse cx="420" cy="600" rx="330" ry="46" fill="none" stroke="#FF7A2B" stroke-width="3" stroke-dasharray="12 9" opacity="0.8"/><rect x="70" y="400" width="120" height="190" rx="10" fill="#17395f" stroke="#ffffff" stroke-width="3"/><line x1="90" y1="430" x2="170" y2="430" stroke="#a7b4c4" stroke-width="3"/><line x1="90" y1="455" x2="170" y2="455" stroke="#a7b4c4" stroke-width="3"/><line x1="90" y1="480" x2="170" y2="480" stroke="#a7b4c4" stroke-width="3"/><path d="M190,560 Q280,600 330,590" fill="none" stroke="#a7b4c4" stroke-width="4"/><rect x="85" y="250" width="80" height="110" rx="10" fill="#17395f" stroke="#ffffff" stroke-width="3"/><rect x="97" y="263" width="56" height="40" rx="4" fill="#5fa8e8" opacity="0.6"/><path d="M125,360 Q125,385 130,400" fill="none" stroke="#a7b4c4" stroke-width="3"/><rect x="320" y="560" width="130" height="36" rx="8" fill="#17395f" stroke="#ffffff" stroke-width="4"/><polyline points="385,560 385,470 520,270 690,330 690,390" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><circle cx="385" cy="470" r="22.5" fill="#0f2a47" stroke="#ffffff" stroke-width="10.5"/><circle cx="520" cy="270" r="22.5" fill="#0f2a47" stroke="#ffffff" stroke-width="10.5"/><circle cx="690" cy="330" r="22.5" fill="#0f2a47" stroke="#ffffff" stroke-width="10.5"/><path d="M650,440 L650,390 L730,390 L730,440" fill="none" stroke="#ffffff" stroke-width="13.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M351,448 A40,40 0 0 1 419,448" fill="none" stroke="#FF7A2B" stroke-width="3" marker-end="url(#ar)"/><path d="M486,248 A40,40 0 0 1 554,248" fill="none" stroke="#FF7A2B" stroke-width="3" marker-end="url(#ar)"/><path d="M656,308 A40,40 0 0 1 724,308" fill="none" stroke="#FF7A2B" stroke-width="3" marker-end="url(#ar)"/><rect x="650" y="460" width="80" height="50" rx="6" fill="none" stroke="#FF7A2B" stroke-width="4"/><line x1="600" y1="514" x2="780" y2="514" stroke="#a7b4c4" stroke-width="4"/><circle cx="470" cy="380" r="19" fill="#FF7A2B"/><text x="470" y="387.0" font-size="20" fill="#0f2a47" font-weight="700" text-anchor="middle">1</text><circle cx="745" cy="420" r="19" fill="#FF7A2B"/><text x="745" y="427.0" font-size="20" fill="#0f2a47" font-weight="700" text-anchor="middle">2</text><circle cx="215" cy="430" r="19" fill="#FF7A2B"/><text x="215" y="437.0" font-size="20" fill="#0f2a47" font-weight="700" text-anchor="middle">3</text><circle cx="195" cy="280" r="19" fill="#FF7A2B"/><text x="195" y="287.0" font-size="20" fill="#0f2a47" font-weight="700" text-anchor="middle">4</text><circle cx="650" cy="615" r="19" fill="#FF7A2B"/><text x="650" y="622.0" font-size="20" fill="#0f2a47" font-weight="700" text-anchor="middle">5</text><circle cx="830" cy="150" r="19" fill="#FF7A2B"/><text x="830" y="157.0" font-size="20" fill="#0f2a47" font-weight="700" text-anchor="middle">1</text><text x="862" y="157.0" font-size="22" fill="#ffffff" font-weight="700" text-anchor="start">Manipulator</text><text x="862" y="186.0" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="start">The “arm” with 6 rotating</text><text x="862" y="208.1" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="start">axes (joints)</text><circle cx="830" cy="264" r="19" fill="#FF7A2B"/><text x="830" y="271.0" font-size="20" fill="#0f2a47" font-weight="700" text-anchor="middle">2</text><text x="862" y="271.0" font-size="22" fill="#ffffff" font-weight="700" text-anchor="start">End effector</text><text x="862" y="300.0" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="start">Gripper, welding torch,</text><text x="862" y="322.1" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="start">suction cup</text><circle cx="830" cy="378" r="19" fill="#FF7A2B"/><text x="830" y="385.0" font-size="20" fill="#0f2a47" font-weight="700" text-anchor="middle">3</text><text x="862" y="385.0" font-size="22" fill="#ffffff" font-weight="700" text-anchor="start">Controller</text><text x="862" y="414.0" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="start">Cabinet with the “brain”:</text><text x="862" y="436.1" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="start">computes every motor’s motion</text><circle cx="830" cy="492" r="19" fill="#FF7A2B"/><text x="830" y="499.0" font-size="20" fill="#0f2a47" font-weight="700" text-anchor="middle">4</text><text x="862" y="499.0" font-size="22" fill="#ffffff" font-weight="700" text-anchor="start">Teach pendant</text><text x="862" y="528.0" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="start">The operator uses it to teach</text><text x="862" y="550.1" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="start">the robot points and programs</text><circle cx="830" cy="606" r="19" fill="#FF7A2B"/><text x="830" y="613.0" font-size="20" fill="#0f2a47" font-weight="700" text-anchor="middle">5</text><text x="862" y="613.0" font-size="22" fill="#ffffff" font-weight="700" text-anchor="start">Safety</text><text x="862" y="642.0" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="start">Fences, light curtains,</text><text x="862" y="664.1" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="start">area scanners</text></svg>