<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" font-family="Montserrat, 'Segoe UI', Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF7A2B"/></marker><marker id="arm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7b4c4"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff5a5a"/></marker></defs><rect width="1200" height="690" rx="24" fill="#0f2a47"/><rect x="40" y="36" width="8" height="34" rx="3" fill="#FF7A2B"/><text x="62" y="64.0" font-size="30" fill="#ffffff" font-weight="700" text-anchor="start">A microgrid: several sources and a “dispatcher” on top</text><line x1="90" y1="360" x2="1110" y2="360" stroke="#FF7A2B" stroke-width="8" stroke-linecap="round"/><text x="600" y="392.0" font-size="16" fill="#FF7A2B" font-weight="700" text-anchor="start">plant busbar</text><rect x="70" y="120" width="240" height="150" rx="16" fill="#17395f" stroke="#2b4a6f" stroke-width="2.5"/><text x="190.0" y="173.1" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">Grid</text><text x="190.0" y="208.6" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="middle">Buy or</text><text x="190.0" y="231.6" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="middle">sell</text><line x1="190" y1="270" x2="190" y2="360" stroke="#ffffff" stroke-width="3"/><line x1="172" y1="285" x2="172" y2="346" stroke="#5fa8e8" stroke-width="3" marker-end="url(#ar)"/><line x1="208" y1="346" x2="208" y2="285" stroke="#4cc38a" stroke-width="3" marker-end="url(#ar)"/><rect x="345" y="120" width="240" height="150" rx="16" fill="#17395f" stroke="#2b4a6f" stroke-width="2.5"/><text x="465.0" y="173.1" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">Solar</text><text x="465.0" y="208.6" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="middle">Cheap by day,</text><text x="465.0" y="231.6" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="middle">but not at night</text><line x1="465" y1="270" x2="465" y2="360" stroke="#ffffff" stroke-width="3"/><line x1="447" y1="285" x2="447" y2="346" stroke="#5fa8e8" stroke-width="3" marker-end="url(#ar)"/><rect x="620" y="120" width="240" height="150" rx="16" fill="#17395f" stroke="#2b4a6f" stroke-width="2.5"/><text x="740.0" y="173.1" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">Battery</text><text x="740.0" y="208.6" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="middle">Stores surplus,</text><text x="740.0" y="231.6" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="middle">releases at peak</text><line x1="740" y1="270" x2="740" y2="360" stroke="#ffffff" stroke-width="3"/><line x1="722" y1="285" x2="722" y2="346" stroke="#5fa8e8" stroke-width="3" marker-end="url(#ar)"/><line x1="758" y1="346" x2="758" y2="285" stroke="#4cc38a" stroke-width="3" marker-end="url(#ar)"/><rect x="895" y="120" width="240" height="150" rx="16" fill="#17395f" stroke="#2b4a6f" stroke-width="2.5"/><text x="1015.0" y="173.1" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">Generator</text><text x="1015.0" y="208.6" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="middle">Backup when</text><text x="1015.0" y="231.6" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="middle">the grid is down</text><line x1="1015" y1="270" x2="1015" y2="360" stroke="#ffffff" stroke-width="3"/><line x1="997" y1="285" x2="997" y2="346" stroke="#5fa8e8" stroke-width="3" marker-end="url(#ar)"/><line x1="210" y1="360" x2="210" y2="460" stroke="#ffffff" stroke-width="3"/><line x1="228" y1="374" x2="228" y2="450" stroke="#5fa8e8" stroke-width="3" marker-end="url(#ar)"/><rect x="70" y="460" width="280" height="140" rx="16" fill="#17395f" stroke="#2b4a6f" stroke-width="2.5"/><text x="210.0" y="508.1" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">Shop floor</text><text x="210.0" y="543.6" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="middle">Main</text><text x="210.0" y="566.6" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="middle">load</text><line x1="550" y1="360" x2="550" y2="460" stroke="#ffffff" stroke-width="3"/><line x1="568" y1="374" x2="568" y2="450" stroke="#5fa8e8" stroke-width="3" marker-end="url(#ar)"/><rect x="410" y="460" width="280" height="140" rx="16" fill="#17395f" stroke="#2b4a6f" stroke-width="2.5"/><text x="550.0" y="508.1" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">Critical</text><text x="550.0" y="543.6" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="middle">Server room, pumps,</text><text x="550.0" y="566.6" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="middle">emergency light</text><rect x="750" y="460" width="380" height="140" rx="16" fill="#17395f" stroke="#FF7A2B" stroke-width="2.5"/><text x="940.0" y="508.1" font-size="22" fill="#FF7A2B" font-weight="700" text-anchor="middle">Energy management system</text><text x="940.0" y="543.6" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="middle">Decides every second where</text><text x="940.0" y="566.6" font-size="17" fill="#a7b4c4" font-weight="500" text-anchor="middle">to take energy and where to send it</text><line x1="940" y1="460" x2="940" y2="366" stroke="#FF7A2B" stroke-width="3" stroke-dasharray="6 6"/><line x1="700" y1="650" x2="740" y2="650" stroke="#5fa8e8" stroke-width="4"/><text x="750" y="656.0" font-size="16" fill="#a7b4c4" font-weight="600" text-anchor="start">energy flow</text><line x1="900" y1="650" x2="940" y2="650" stroke="#4cc38a" stroke-width="4"/><text x="950" y="656.0" font-size="16" fill="#a7b4c4" font-weight="600" text-anchor="start">reverse: charging, export</text></svg>