<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Montserrat, 'Segoe UI', Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF7A2B"/></marker><marker id="arm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a7b4c4"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff5a5a"/></marker></defs><rect width="1200" height="640" rx="24" fill="#0f2a47"/><rect x="40" y="36" width="8" height="34" rx="3" fill="#FF7A2B"/><text x="62" y="64.0" font-size="30" fill="#ffffff" font-weight="700" text-anchor="start">Energy management is a cycle, not a one-off project</text><rect x="70" y="140" width="330" height="170" rx="16" fill="#17395f" stroke="#2b4a6f" stroke-width="2.5"/><text x="235.0" y="200.9" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">1. Plan</text><text x="235.0" y="238.9" font-size="19" fill="#a7b4c4" font-weight="500" text-anchor="middle">Find the biggest</text><text x="235.0" y="264.6" font-size="19" fill="#a7b4c4" font-weight="500" text-anchor="middle">consumers, set a target</text><rect x="800" y="140" width="330" height="170" rx="16" fill="#17395f" stroke="#FF7A2B" stroke-width="2.5"/><text x="965.0" y="200.9" font-size="24" fill="#FF7A2B" font-weight="700" text-anchor="middle">2. Do</text><text x="965.0" y="238.9" font-size="19" fill="#a7b4c4" font-weight="500" text-anchor="middle">Put measures in place:</text><text x="965.0" y="264.6" font-size="19" fill="#a7b4c4" font-weight="500" text-anchor="middle">LEDs, VFDs, schedules</text><rect x="800" y="420" width="330" height="170" rx="16" fill="#17395f" stroke="#2b4a6f" stroke-width="2.5"/><text x="965.0" y="481.0" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">3. Check</text><text x="965.0" y="519.0" font-size="19" fill="#a7b4c4" font-weight="500" text-anchor="middle">Measure and compare</text><text x="965.0" y="544.6" font-size="19" fill="#a7b4c4" font-weight="500" text-anchor="middle">with the baseline</text><rect x="70" y="420" width="330" height="170" rx="16" fill="#17395f" stroke="#2b4a6f" stroke-width="2.5"/><text x="235.0" y="481.0" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">4. Act</text><text x="235.0" y="519.0" font-size="19" fill="#a7b4c4" font-weight="500" text-anchor="middle">Keep what worked</text><text x="235.0" y="544.6" font-size="19" fill="#a7b4c4" font-weight="500" text-anchor="middle">and go round again</text><line x1="400" y1="225" x2="795" y2="225" stroke="#FF7A2B" stroke-width="3.5" marker-end="url(#ar)"/><line x1="965" y1="310" x2="965" y2="415" stroke="#FF7A2B" stroke-width="3.5" marker-end="url(#ar)"/><line x1="800" y1="505" x2="405" y2="505" stroke="#FF7A2B" stroke-width="3.5" marker-end="url(#ar)"/><line x1="235" y1="420" x2="235" y2="315" stroke="#FF7A2B" stroke-width="3.5" marker-end="url(#ar)"/><text x="600" y="212.0" font-size="18" fill="#a7b4c4" font-weight="600" text-anchor="middle"></text><text x="985" y="370.0" font-size="18" fill="#a7b4c4" font-weight="600" text-anchor="start"></text><text x="600" y="538.0" font-size="18" fill="#a7b4c4" font-weight="600" text-anchor="middle"></text><text x="215" y="370.0" font-size="18" fill="#a7b4c4" font-weight="600" text-anchor="end"></text><circle cx="600" cy="365" r="78" fill="#FF7A2B"/><text x="600" y="358.0" font-size="24" fill="#0f2a47" font-weight="700" text-anchor="middle">ISO</text><text x="600" y="388.0" font-size="24" fill="#0f2a47" font-weight="700" text-anchor="middle">50001</text></svg>